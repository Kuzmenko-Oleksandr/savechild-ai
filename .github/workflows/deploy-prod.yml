name: Deploy PROD

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync code to server (PROD)
        run: |
          rsync -az --delete \
            --no-perms --no-owner --no-group --no-times \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude=".env" \
            --exclude="storage/**" \
            --exclude="bootstrap/cache/**" \
            --exclude="public/build" \
            --exclude=".github" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o PreferredAuthentications=publickey" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/savechild/

      - name: Install deps + build + migrate (PROD)
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o PreferredAuthentications=publickey \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSH'
            set -e
            cd /var/www/savechild

            # ensure writable runtime dirs exist (not shipped via rsync)
            mkdir -p bootstrap/cache \
              storage/app/public \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            npm ci
            npm run build

            php artisan storage:link || true
            php artisan migrate --force

            php artisan optimize:clear
            php artisan event:clear || true
            php artisan config:cache
            php artisan view:cache || true
            # NOTE: no route:cache — routes use closures + helper functions in
            # web.php, which are not available when routes are served from cache.
            php artisan route:clear || true
            php artisan queue:restart

            # ownership/permissions for php-fpm (www-data), reset on every deploy
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
          SSH
